name: Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # one Mekanism breaking must not hide whether the others build
      matrix:
        mekanism: [original, ce, ceu]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the mod version comes from `git describe`, which needs the tags
      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          java-version: '25' # the Gradle process only; the mod still compiles to Java 8 bytecode
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: never
      - name: Build with Gradle
        run: ./gradlew build -Pmekanism_flavour=${{ matrix.mekanism }}
      - name: Upload Artifact
        if: matrix.mekanism == 'ce' # the release is built against ce; the other two only check that it compiles
        uses: actions/upload-artifact@v7
        with:
          name: MekanismEnergistics
          path: build/libs/*.jar
